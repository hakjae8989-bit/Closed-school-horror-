<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080a">
<meta name="format-detection" content="telephone=no">
<title>폐교</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#07080a;--bone:#e8e2d2;--blood:#a32222;--key:#d9b44a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;background:var(--bg);color:var(--bone);font-family:"Nanum Myeongjo",Georgia,serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;font-size:15px;color:var(--key);text-shadow:0 0 8px #000;line-height:1.45;max-width:78vw;pointer-events:none;z-index:5}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));text-align:center;background:rgba(5,5,6,.94);z-index:10;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
h1{margin:0;font-size:clamp(40px,12vw,72px);font-weight:800;color:var(--blood);letter-spacing:.08em}
p{margin:0;max-width:32ch;line-height:1.65;color:#b9b3a4;font-size:15px}
button{font:inherit;font-size:18px;padding:14px 28px;background:none;color:var(--bone);border:1px solid var(--bone);border-radius:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:48px}
button:focus-visible{outline:2px solid var(--key);outline-offset:3px}
button:active{background:rgba(232,226,210,.12)}
#diff{display:flex;flex-direction:column;gap:10px;width:min(280px,90vw);margin-top:6px}
#diff button{width:100%;padding:14px 16px;font-size:17px}
#diff .easy{border-color:#6a8a5a;color:#a8c898}
#diff .hard{border-color:var(--key);color:var(--key)}
#diff .imp{border-color:var(--blood);color:#e07070}
#diff small{display:block;font-size:12px;opacity:.65;margin-top:3px;font-weight:400}
#hb{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:none;background:rgba(10,8,6,.85);z-index:6;min-width:88px;min-height:52px;font-size:18px;padding:12px 18px;border-radius:4px}
#pad{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,5,6,.94);z-index:20;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#pad .digits{font-size:36px;letter-spacing:.35em;color:var(--key);min-height:1.2em}
#pad .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:300px}
#pad .row button{width:68px;height:56px;font-size:22px;padding:0;min-height:56px}
#pad .hint{font-size:15px;color:#8a8478;margin-bottom:4px}
#modes,#multi,#lobby{display:flex;flex-direction:column;gap:10px;width:min(280px,90vw);margin-top:6px;align-items:stretch}
#modes button,#multi button{width:100%;padding:14px 16px;font-size:17px}
#modes .solo{border-color:#6a8a5a;color:#a8c898}#modes .multi{border-color:var(--key);color:var(--key)}
#code{font:inherit;font-size:22px;text-align:center;letter-spacing:.3em;padding:14px;background:rgba(0,0,0,.4);color:var(--bone);border:1px solid var(--bone);border-radius:2px;user-select:text;-webkit-user-select:text;width:100%;box-sizing:border-box;min-height:52px}
#lcode{font-size:28px;color:var(--key);letter-spacing:.1em}#lcount,#nmsg{font-size:14px;color:#b9b3a4;min-height:1em}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body>
<canvas id="c"></canvas><div id="hud"></div><button type="button" id="hb">숨기</button>
<div id="pad">
  <div class="hint" id="phint">비밀번호 입력</div>
  <div class="digits" id="pdig">____</div>
  <div class="row" id="prow"></div>
  <div class="row"><button type="button" id="pclr">지우기</button><button type="button" id="pok">확인</button><button type="button" id="pcancel">닫기</button></div>
</div>
<div id="ov">
  <h1 id="t">폐교</h1>
  <p id="d">복도 어딘가에 열쇠가 떨어져 있다. 손전등 빛이 닿으면 그것은 느려진다. 십자가를 주우면 한 번씩 살아난다. 옷장에 숨으면 움직이는 막대를 빈칸에 맞춰 멈춰야 한다. 세 번 틀리면 들킨다.</p>
  <p id="h">이동: 방향키·WASD 또는 화면 드래그 / 숨기·입력판: E키 또는 버튼 / 옷장 안: 스페이스·탭 · 모바일 터치 지원</p>
  <div id="modes"><button type="button" class="solo" id="bSolo">SOLO</button><button type="button" class="multi" id="bMulti">MULTI<small style="display:block;font-size:12px;opacity:.65;margin-top:3px">방 코드 4자리로 친구와 함께</small></button></div>
  <div id="diff" style="display:none">
    <button type="button" class="easy" id="bEasy">EASY<small>비밀번호 없음 · 귀신 느림 · 10분</small></button>
    <button type="button" class="hard" id="bHard">HARD<small>비밀번호 1개 · 5분 · 플레이어 조금 빠름</small></button>
    <button type="button" class="imp" id="bImp">IMPOSSIBLE<small>비밀번호 2개 · 5분 · 매우 빠름</small></button>
  </div>
  <div id="multi" style="display:none"><button type="button" id="bHost">방 만들기</button><input id="code" inputmode="numeric" maxlength="4" placeholder="방 코드 4자리" autocomplete="off"><button type="button" id="bJoin">참가</button></div>
  <div id="lobby" style="display:none"><p id="lcode"></p><p id="lcount"></p></div>
  <p id="nmsg"></p>
  <button type="button" id="bBack" style="display:none">뒤로</button>
</div>
<script>
/* ===== MAKER MODE (주소 끝에 #Maker_mode 를 붙이면 켜짐) ===== */
(function(){
var KEY='mk_src_v1',inited=false,api={};
function el(t,css,txt){var e=document.createElement(t);if(css)e.style.cssText=css;if(txt!=null)e.textContent=txt;return e}
function init(){
 var orig=window.__MK_SRC||('<!doctype html>\n'+document.documentElement.outerHTML);
 var BTN='font:inherit;font-size:13px;padding:8px 10px;min-height:38px;background:#1a1714;color:#e8e2d2;border:1px solid #6a6254;border-radius:3px;cursor:pointer;touch-action:manipulation';
 var INP='font:inherit;font-size:13px;padding:7px 8px;min-height:36px;background:#000;color:#e8e2d2;border:1px solid #6a6254;border-radius:3px;box-sizing:border-box;user-select:text;-webkit-user-select:text;min-width:0';
 var LAB='display:flex;align-items:center;gap:8px;margin:2px 0;font-size:13px';
 var NUM='font:inherit;font-size:14px;padding:6px 8px;width:72px;min-height:34px;background:#000;color:#e8e2d2;border:1px solid #6a6254;border-radius:3px;box-sizing:border-box;text-align:center';
 var fab=el('button','position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:46px;height:46px;border-radius:50%;font-size:20px;padding:0;background:rgba(0,0,0,.75);border:1px solid #d9b44a;color:#d9b44a;z-index:9998;cursor:pointer;touch-action:manipulation','🛠');
 var panel=el('div','position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;gap:6px;background:#0b0a09;color:#e8e2d2;font:13px/1.4 system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);touch-action:pan-y;text-align:left;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain');panel.id='mkpanel';
 ['keydown','keyup','keypress'].forEach(function(n){panel.addEventListener(n,function(e){e.stopPropagation()})});
 var head=el('div','display:flex;align-items:baseline;gap:8px;flex-wrap:wrap');
 head.appendChild(el('b','color:#d9b44a;font-size:15px','🛠 관리자 모드'));
 head.appendChild(el('span','opacity:.6;font-size:12px','숫자를 바꾸면 이 브라우저와 멀티 참가자에게 함께 적용됩니다. 파일로 고정하려면 내려받기 하세요.'));
 var bar=el('div','display:flex;gap:6px;flex-wrap:wrap');
 function b(label,fn){var x=el('button',BTN,label);x.type='button';x.addEventListener('click',fn);bar.appendChild(x);return x}

 var paramBox=el('div','border:1px solid #3a342c;border-radius:4px;padding:10px;background:#120f0c;margin:4px 0');
 paramBox.appendChild(el('div','color:#d9b44a;font-size:14px;margin-bottom:8px;font-weight:600','게임 밸런스 설정'));
 var diffs=['easy','hard','impossible'];
 var labels={easy:'EASY (쉬움)',hard:'HARD (보통)',impossible:'IMPOSSIBLE (매우 어려움)'};
 var fields=[
  {key:'playerSp',label:'플레이어 속도'},
  {key:'ghostBase',label:'귀신 기본 속도'},
  {key:'ghostScale',label:'귀신 속도 증가'},
  {key:'timeLimit',label:'제한 시간(초)'},
  {key:'needPass',label:'비밀번호 개수'},
  {key:'hideMax',label:'옷장 최대 시간(초)'}
 ];
 var defaults={
  easy:{playerSp:155,ghostBase:50,ghostScale:8,timeLimit:600,needPass:0,hideMax:22},
  hard:{playerSp:175,ghostBase:155,ghostScale:38,timeLimit:300,needPass:1,hideMax:15},
  impossible:{playerSp:160,ghostBase:165,ghostScale:42,timeLimit:300,needPass:2,hideMax:12}
 };
 var inputs={};
 function makeRow(lab,inp){var r=el('div',LAB);r.appendChild(el('span','min-width:120px;opacity:.9',lab+':'));r.appendChild(inp);return r}
 diffs.forEach(function(d){
  var sec=el('div','margin:10px 0 6px;padding-top:8px;border-top:1px solid #2a2420');
  sec.appendChild(el('div','color:#c8b890;font-size:13px;margin-bottom:4px',labels[d]));
  inputs[d]={};
  fields.forEach(function(f){
   var inp=el('input',NUM);inp.type='number';inp.value=(CUSTOM_BAL&&CUSTOM_BAL[d]&&CUSTOM_BAL[d][f.key]!=null)?CUSTOM_BAL[d][f.key]:defaults[d][f.key];inp.min=0;
   inputs[d][f.key]=inp;
   sec.appendChild(makeRow(f.label,inp));
  });
  paramBox.appendChild(sec);
 });
 var applyBtn=el('button',BTN+';margin-top:10px;border-color:#d9b44a;color:#d9b44a','적용 (전체 반영)');applyBtn.type='button';
 paramBox.appendChild(applyBtn);

 function parseFromCode(){
  var v=ta.value;
  function grab(block,key){var m=block.match(new RegExp(key+'=(\\d+)'));return m?m[1]:null}
  diffs.forEach(function(d){
   var block='';
   if(d==='easy'){var m=v.match(/if\(d===['"]easy['"]\)\{[^}]*\}/);if(m)block=m[0]}
   else if(d==='hard'){var m=v.match(/else if\(d===['"]hard['"]\)\{[^}]*\}/);if(m)block=m[0]}
   else{var m=v.match(/else\{\s*timeLimit=\d+;ghostBase=\d+;ghostScale=\d+;playerSp=\d+;needPass=\d+;hideMax=\d+;\s*\}/);if(m)block=m[0]}
   if(!block)return;
   fields.forEach(function(f){var val=grab(block,f.key);if(val!=null)inputs[d][f.key].value=val});
  });
 }
 function applyParams(){
  var bal={};
  diffs.forEach(function(d){
   bal[d]={};
   fields.forEach(function(f){bal[d][f.key]=+inputs[d][f.key].value||0});
  });
  try{CUSTOM_BAL=bal;localStorage.setItem('mk_bal_v1',JSON.stringify(bal))}catch(e){}

  var v=ta.value;
  var baked="let CUSTOM_BAL="+JSON.stringify(bal)+";try{localStorage.setItem('mk_bal_v1',JSON.stringify(CUSTOM_BAL))}catch(e){}";

  // 1) Bake CUSTOM_BAL into the game source (unique declaration line)
  if(/let CUSTOM_BAL=null;try\{CUSTOM_BAL=JSON\.parse\(localStorage\.getItem\('mk_bal_v1'\)/.test(v)){
    v=v.replace(/let CUSTOM_BAL=null;try\{CUSTOM_BAL=JSON\.parse\(localStorage\.getItem\('mk_bal_v1'\)\|\|'null'\)\}catch\(e\)\{CUSTOM_BAL=null\}/,baked);
  }else if(/let CUSTOM_BAL=\{"easy":/.test(v)){
    v=v.replace(/let CUSTOM_BAL=\{"easy":\{.*?\};try\{localStorage\.setItem\('mk_bal_v1',JSON\.stringify\(CUSTOM_BAL\)\)\}catch\(e\)\{\}/,baked);
  }

  // 2) Patch numbers only inside the real startGame body
  var sg=v.indexOf('function startGame(d,seed,bal){\n  ensureAudio');
  if(sg>=0){
    var brace=v.indexOf('{',sg);
    var depth=0,endSg=brace;
    for(var i=brace;i<v.length;i++){
      if(v[i]==='{')depth++;
      else if(v[i]==='}'){depth--;if(depth===0){endSg=i+1;break}}
    }
    var head=v.slice(0,sg);
    var body=v.slice(sg,endSg);
    var tail=v.slice(endSg);
    body=body.replace(/if\(d==='easy'\)\{[^}]*\}/,
      "if(d==='easy'){\n    timeLimit="+bal.easy.timeLimit+";ghostBase="+bal.easy.ghostBase+";ghostScale="+bal.easy.ghostScale+";playerSp="+bal.easy.playerSp+";needPass="+bal.easy.needPass+";hideMax="+bal.easy.hideMax+";\n  }");
    body=body.replace(/else if\(d==='hard'\)\{[^}]*\}/,
      "else if(d==='hard'){\n    timeLimit="+bal.hard.timeLimit+";ghostBase="+bal.hard.ghostBase+";ghostScale="+bal.hard.ghostScale+";playerSp="+bal.hard.playerSp+";needPass="+bal.hard.needPass+";hideMax="+bal.hard.hideMax+";\n  }");
    body=body.replace(/else\{\s*timeLimit=\d+;ghostBase=\d+;ghostScale=\d+;playerSp=\d+;needPass=\d+;hideMax=\d+;\s*\}/,
      "else{\n    timeLimit="+bal.impossible.timeLimit+";ghostBase="+bal.impossible.ghostBase+";ghostScale="+bal.impossible.ghostScale+";playerSp="+bal.impossible.playerSp+";needPass="+bal.impossible.needPass+";hideMax="+bal.impossible.hideMax+";\n  }");
    v=head+body+tail;
  }

  ta.value=v;
  status('적용 완료. 이제 내려받기 하면 받은 파일에도 설정이 들어갑니다');
}
 applyBtn.addEventListener('click',applyParams);

 var row=el('div','display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px');
 var sel=el('select',INP+';max-width:46%');
 var fi=el('input',INP+';flex:1 1 90px');fi.placeholder='찾기';
 var ri=el('input',INP+';flex:1 1 90px');ri.placeholder='바꿀 말';
 var ta=el('textarea','flex:0 0 auto;min-height:100px;max-height:28vh;width:100%;box-sizing:border-box;font:12px/16px ui-monospace,Menlo,Consolas,monospace;background:#000;color:#d8d2c2;border:1px solid #6a6254;border-radius:3px;padding:8px;white-space:pre;overflow:auto;resize:vertical;tab-size:2;user-select:text;-webkit-user-select:text;touch-action:pan-x pan-y');
 ta.wrap='off';ta.spellcheck=false;ta.setAttribute('autocapitalize','off');ta.setAttribute('autocorrect','off');
 var st=el('div','min-height:18px;font-size:12px;color:#9a9488');
 var errLine=0;
 function status(m,err){st.textContent=m;st.style.color=err?'#ff6a6a':'#9a9488'}
 function go(i,len){ta.focus();ta.setSelectionRange(i,i+len);var ln=ta.value.slice(0,i).split('\n').length-1;ta.scrollTop=Math.max(0,ln*16-ta.clientHeight/3)}
 function goLine(n){var v=ta.value.split('\n'),i=0;for(var k=0;k<n-1&&k<v.length;k++)i+=v[k].length+1;go(i,(v[n-1]||'').length)}
 function fns(){var v=ta.value,re=/function\s+([A-Za-z_$][\w$]*)\s*\(/g,m,o='<option value="">함수 바로가기…</option>';while((m=re.exec(v)))o+='<option value="'+m.index+'">'+m[1]+'</option>';sel.innerHTML=o}
 sel.addEventListener('pointerdown',fns);sel.addEventListener('focus',fns);
 sel.addEventListener('change',function(){if(sel.value!==''){go(+sel.value,8);sel.value=''}});
 ta.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end')}});
 function next(){var v=ta.value,q=fi.value;if(!q)return;var i=v.indexOf(q,ta.selectionEnd);if(i<0)i=v.indexOf(q);if(i<0){status('찾지 못했어요');return}go(i,q.length);status('')}
 fi.addEventListener('keydown',function(e){if(e.key==='Enter')next()});
 var nb=el('button',BTN,'다음');nb.type='button';nb.addEventListener('click',next);
 var rb=el('button',BTN,'모두 바꾸기');rb.type='button';rb.addEventListener('click',function(){var q=fi.value;if(!q)return;var n=ta.value.split(q).length-1;if(!n){status('찾지 못했어요');return}ta.value=ta.value.split(q).join(ri.value);status(n+'곳을 바꿨어요')});
 row.appendChild(sel);row.appendChild(fi);row.appendChild(nb);row.appendChild(ri);row.appendChild(rb);
 var run=null;
 function stopRun(){if(run){run.f.remove();run.bar.remove();run=null}panel.style.display='flex';fab.style.display='none'}
 function start(){
  var hook='<script>addEventListener("error",function(e){parent.postMessage({mkErr:(e.message||"")+" (줄 "+(e.lineno||"?")+")",line:e.lineno||0},"*")});addEventListener("unhandledrejection",function(e){parent.postMessage({mkErr:String(e.reason)},"*")})<\/script>';
  var src=ta.value,done=false;
  src=src.replace(/<head[^>]*>/i,function(m){done=true;return m+hook});
  if(!done)src=hook+src;
  if(run)stopRun();
  errLine=0;status('');
  var f=el('iframe','position:fixed;inset:0;width:100%;height:100%;border:0;z-index:10000;background:#000');
  f.setAttribute('allow','autoplay');f.srcdoc=src;
  var rb2=el('div','position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:10001;display:flex;gap:8px;align-items:center;max-width:calc(100% - 20px)');
  var cb=el('button',BTN+';background:rgba(0,0,0,.85);border-color:#d9b44a;color:#d9b44a','✕ 편집으로');cb.type='button';cb.addEventListener('click',stopRun);
  var et=el('span','color:#ff6a6a;font:12px system-ui,sans-serif;background:rgba(0,0,0,.8);padding:4px 6px;border-radius:3px;display:none');
  rb2.appendChild(cb);rb2.appendChild(et);
  f.addEventListener('load',function(){try{f.contentWindow.focus()}catch(e){}});
  document.body.appendChild(f);document.body.appendChild(rb2);
  run={f:f,bar:rb2,et:et};panel.style.display='none';fab.style.display='none';
 }
 window.addEventListener('message',function(e){var d=e.data;if(d&&d.mkErr){errLine=d.line||0;status('실행 오류: '+d.mkErr,true);if(run){run.et.textContent='⚠ '+d.mkErr;run.et.style.display='inline-block'}}});
 b('▶ 실행',start);
 b('저장',function(){try{localStorage.setItem(KEY,ta.value);status('이 브라우저에 저장했어요')}catch(e){status('저장하지 못했어요 (브라우저가 막고 있어요)',true)}});
 b('불러오기',function(){var v=null;try{v=localStorage.getItem(KEY)}catch(e){}if(v){ta.value=v;parseFromCode();status('저장본을 불러왔어요')}else status('저장본이 없어요')});
 b('내려받기',function(){applyParams();var a=el('a'),u=URL.createObjectURL(new Blob([ta.value],{type:'text/html'}));a.href=u;a.download='horror-game-edited.html';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);status('수정본 파일을 내려받았어요 · 이 파일을 열면 적용한 설정이 그대로입니다')});
